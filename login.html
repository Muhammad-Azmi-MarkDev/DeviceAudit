<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Device Audit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between p-4 antialiased text-slate-800">

  <header class="max-w-md w-full mx-auto pt-4 flex justify-between items-center">
    <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Kembali ke Ruang Uji
    </a>
    <span class="text-xs font-bold text-slate-500 tracking-tight">Device<span class="text-blue-600">Audit</span></span>
  </header>

  <main class="max-w-md w-full mx-auto my-auto bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-lg space-y-6">
    <div class="text-center space-y-1.5">
      <div class="w-11 h-11 bg-slate-900 text-white rounded-xl mx-auto flex items-center justify-center shadow-sm mb-2">
        <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      </div>
      <h1 class="text-lg font-bold text-slate-900" id="judul-kartu">Masuk ke Akun</h1>
      <p class="text-xs text-slate-500">Simpan dan kelola riwayat laporan inspeksi perangkat Anda.</p>
    </div>

    <div class="flex p-1 bg-slate-100 rounded-xl text-xs font-semibold">
      <button id="btn-tab-masuk" onclick="setTab('masuk')" class="flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition">Masuk</button>
      <button id="btn-tab-daftar" onclick="setTab('daftar')" class="flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-800 transition">Daftar Akun</button>
    </div>

    <div id="alert-box" class="hidden p-3 rounded-xl text-xs font-medium border"></div>

    <!-- Form Login -->
    <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
      <div class="space-y-1">
        <label class="block font-semibold text-slate-700">Email</label>
        <input type="email" id="login-email" required placeholder="nama@domain.com" 
               class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:bg-white focus:border-blue-600 focus:outline-none">
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-slate-700">Kata Sandi</label>
        <input type="password" id="login-pass" required placeholder="••••••••" 
               class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:bg-white focus:border-blue-600 focus:outline-none">
      </div>
      <button type="submit" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-lg transition">
        Masuk
      </button>

      <div class="pt-4 border-t border-slate-100 space-y-2">
        <button type="button" onclick="isiDemo()" class="w-full p-2.5 border border-slate-200 rounded-lg text-center hover:bg-slate-50 transition">
          <span class="block font-semibold text-slate-800 text-[11px]">Isi Akun Uji Coba (Demo)</span>
          <span class="text-[10px] text-slate-400">demo@deviceaudit.id • Sandi: 123456</span>
        </button>
      </div>
    </form>

    <!-- Form Register (Tanpa pilihan role) -->
    <form id="form-register" onsubmit="handleRegister(event)" class="hidden space-y-3.5 text-xs">
      <div class="space-y-1">
        <label class="block font-semibold text-slate-700">Nama Lengkap</label>
        <input type="text" id="reg-nama" required placeholder="Nama Anda" 
               class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:bg-white focus:border-blue-600 focus:outline-none">
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-slate-700">Email</label>
        <input type="email" id="reg-email" required placeholder="nama@domain.com" 
               class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:bg-white focus:border-blue-600 focus:outline-none">
      </div>
      <div class="space-y-1">
        <label class="block font-semibold text-slate-700">Kata Sandi</label>
        <input type="password" id="reg-pass" required placeholder="Minimal 6 karakter" 
               class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:bg-white focus:border-blue-600 focus:outline-none">
      </div>
      <button type="submit" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-lg transition">
        Buat Akun
      </button>
    </form>
  </main>

  <footer class="text-center text-[11px] text-slate-400 pb-4">
    Device Audit • Sistem Diagnostik & Verifikasi Perangkat Keras
  </footer>

  <script src="auth.js"></script>
  <script>
    guardLoginPage();

    function setTab(mode) {
      const fLogin = document.getElementById('form-login');
      const fReg = document.getElementById('form-register');
      const bMasuk = document.getElementById('btn-tab-masuk');
      const bDaftar = document.getElementById('btn-tab-daftar');
      document.getElementById('alert-box').classList.add('hidden');

      if (mode === 'masuk') {
        fLogin.classList.remove('hidden');
        fReg.classList.add('hidden');
        bMasuk.className = "flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition";
        bDaftar.className = "flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-800 transition";
        document.getElementById('judul-kartu').innerText = "Masuk ke Akun";
      } else {
        fReg.classList.remove('hidden');
        fLogin.classList.add('hidden');
        bDaftar.className = "flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition";
        bMasuk.className = "flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-800 transition";
        document.getElementById('judul-kartu').innerText = "Daftar Akun Baru";
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const res = loginUser(document.getElementById('login-email').value, document.getElementById('login-pass').value);
      if (res.success) {
        showAlert('Berhasil masuk. Mengalihkan ke ruang uji...', 'sukses');
        setTimeout(() => window.location.href = 'index.html', 800);
      } else {
        showAlert(res.message, 'error');
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const res = registerUser({
        nama: document.getElementById('reg-nama').value,
        email: document.getElementById('reg-email').value,
        sandi: document.getElementById('reg-pass').value
      });
      if (res.success) {
        showAlert('Akun berhasil dibuat. Mengalihkan...', 'sukses');
        setTimeout(() => window.location.href = 'index.html', 800);
      } else {
        showAlert(res.message, 'error');
      }
    }

    function isiDemo() {
      document.getElementById('login-email').value = 'demo@deviceaudit.id';
      document.getElementById('login-pass').value = '123456';
      showAlert('Kredensial akun demo telah diisi. Silakan tekan Masuk.', 'info');
    }

    function showAlert(msg, tipe) {
      const el = document.getElementById('alert-box');
      el.className = 'p-3 rounded-xl text-xs font-medium border block';
      if (tipe === 'error') el.classList.add('bg-rose-50', 'text-rose-700', 'border-rose-200');
      else if (tipe === 'sukses') el.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
      else el.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-200');
      el.innerText = msg;
    }
  </script>
</body>
</html>
